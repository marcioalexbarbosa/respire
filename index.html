<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070b1a" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Guia visual para a técnica de respiração 4-7-8: inspire 4, segure 7, expire 8. Funciona offline e pode ser instalado no celular." />
<title>Respiração 4-7-8</title>

<!-- PWA (caminhos relativos p/ funcionar também abrindo o arquivo local) -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Respire" />
<style>
  :root {
    --accent: #6fd6ff;
    --accent-2: #b08bff;
    --glow1: 111,214,255;
    --glow2: 176,139,255;
    --bg-0: #070b1a;
    --bg-1: #0e1530;
    --text: #eaf2ff;
    --muted: #8ea0c9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    /* no app instalado (e no Chrome mobile) evita o "puxar p/ recarregar"
       e o balanço elástico durante a sessão */
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 800px at 50% -10%, #16204a 0%, transparent 60%),
      radial-gradient(900px 700px at 80% 110%, #1a1340 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    /* soma (em vez de max) as áreas seguras: no app instalado do iOS a barra
       de status é translúcida e fica por cima do conteúdo */
    padding:
      calc(20px + env(safe-area-inset-top, 0px)) 20px
      calc(20px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation; /* mata o zoom por duplo toque */
  }

  header {
    text-align: center;
    margin-top: 8px;
  }

  h1 {
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  header p {
    color: var(--muted);
    font-size: clamp(0.75rem, 3vw, 0.9rem);
    margin-top: 4px;
  }

  /* ---- Breathing stage ---- */
  .stage {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }

  .orb-wrap {
    position: relative;
    /* quadrado explícito (largura == altura) em vez de aspect-ratio,
       para o Safari/iPad não sair do quadrado e desalinhar o anel */
    width: min(72vw, 56vh, 360px);
    height: min(72vw, 56vh, 360px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* progress ring */
  .ring {
    position: absolute;
    /* explicit size + offset instead of inset alone: Safari/iOS ignores
       inset on an <svg> with no width/height and falls back to its 300x150
       intrinsic size, throwing the ring up and to the right */
    top: -6%;
    left: -6%;
    width: 112%;
    height: 112%;
    transform: rotate(-90deg);
  }
  .ring circle {
    fill: none;
    stroke-width: 3;
  }
  .ring .track { stroke: rgba(255,255,255,0.07); }
  .ring .prog {
    stroke: url(#grad);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
    filter: drop-shadow(0 0 6px rgba(var(--glow1),0.5));
  }
  /* gradiente do anel segue o tema */
  #grad .g1 { stop-color: var(--accent); }
  #grad .g2 { stop-color: var(--accent-2); }

  .orb {
    /* centralizado pelo flexbox do .orb-wrap (rock-solid no Safari),
       em vez de inset:0 + margin:auto que o Safari/iPad desalinhava */
    width: 38%;
    height: 38%;
    border-radius: 50%;
    transform-origin: center center;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15) 35%, transparent 60%),
      radial-gradient(circle at 50% 50%, var(--accent), var(--accent-2));
    box-shadow:
      0 0 60px 10px rgba(var(--glow1),0.35),
      0 0 120px 30px rgba(var(--glow2),0.2),
      inset 0 0 40px rgba(255,255,255,0.25);
    /* centered via inset:0 + margin:auto; only scale is animated */
    transform: scale(var(--scale, 0.55));
    transition: transform var(--phase-dur, 4s) cubic-bezier(0.45, 0, 0.55, 1);
    will-change: transform;
  }

  .orb.calm {
    /* gentle idle pulse when not running */
    animation: idle 6s ease-in-out infinite;
  }
  @keyframes idle {
    0%, 100% { transform: scale(0.52); }
    50%      { transform: scale(0.6); }
  }

  .center-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
  }
  .phase {
    font-size: clamp(1.3rem, 6vw, 2rem);
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  .count {
    font-size: clamp(2.6rem, 14vw, 4.2rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-top: 4px;
    text-shadow: 0 2px 24px rgba(0,0,0,0.45);
  }
  .hint {
    position: absolute;
    bottom: 2%;
    left: 0;
    right: 0;
    color: var(--muted);
    font-size: clamp(0.75rem, 3vw, 0.9rem);
    padding: 0 8%;
    min-height: 1.2em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  /* ---- Controls ---- */
  .controls {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .cycles {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    min-height: 1.2em;
  }
  .cycles b { color: var(--text); font-weight: 600; }

  .btn-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  button {
    flex: 1;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
    backdrop-filter: blur(6px);
  }
  button:hover { background: rgba(255,255,255,0.1); }
  button:active { transform: scale(0.97); }

  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0a1026;
    border: none;
    box-shadow: 0 8px 24px rgba(var(--glow1),0.3);
  }

  .opts {
    display: flex;
    gap: 18px;
    align-items: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .opts label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .opts select {
    font: inherit;
    color: var(--text);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 6px 8px;
  }
  .opts input[type=checkbox] {
    width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;
  }

  /* ---- Seletor de tema ---- */
  .themes {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .themes .lbl {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    margin-right: 2px;
  }
  .swatch {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    backdrop-filter: none;
  }
  .swatch:hover { transform: scale(1.12); background: inherit; }
  .swatch[aria-checked="true"] {
    border-color: #fff;
    transform: scale(1.12);
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
  }

  /* botão de instalar (só aparece quando o navegador oferece a instalação) */
  .install {
    flex: 0 0 auto;
    width: 100%;
    padding: 12px 16px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    border-radius: 14px;
    border-style: dashed;
    background: transparent;
  }
  .install:hover { background: rgba(255,255,255,0.06); }

  [hidden] { display: none !important; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .orb.calm { animation: none; }
    button { transition: none; }
  }

  @media (max-height: 620px) {
    header p { display: none; }
    .hint { display: none; }
    .install { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Respiração 4-7-8</h1>
    <p>Inspire 4 &middot; Segure 7 &middot; Expire 8</p>
  </header>

  <div class="stage">
    <div class="orb-wrap">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop class="g1" offset="0%" stop-color="#6fd6ff"/>
            <stop class="g2" offset="100%" stop-color="#b08bff"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="50" cy="50" r="48"/>
        <circle class="prog" cx="50" cy="50" r="48"/>
      </svg>

      <div class="orb calm" id="orb"></div>

      <div class="center-text" role="status" aria-live="polite" aria-atomic="true">
        <div class="phase" id="phase">Pronto</div>
        <div class="count" id="count" aria-hidden="true">4-7-8</div>
        <div class="hint" id="hint">Toque em Iniciar para começar</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="cycles" id="cycles">Meta: <b>4</b> ciclos</div>
    <div class="btn-row">
      <button class="primary" id="startBtn">Iniciar</button>
      <button id="resetBtn">Reiniciar</button>
    </div>
    <div class="opts">
      <label>
        Ciclos
        <select id="goalSelect">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4" selected>4</option>
          <option value="8">8</option>
          <option value="0">∞</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="soundToggle" />
        Som
      </label>
    </div>
    <div class="themes" id="themes" role="radiogroup" aria-label="Tema">
      <span class="lbl">Tema</span>
    </div>
    <button class="install" id="installBtn" type="button" hidden>
      ⤓&nbsp; Instalar no dispositivo
    </button>
  </div>

<script>
(() => {
  "use strict";

  // ---- preferências (localStorage pode estar bloqueado: nunca quebrar) ----
  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (e) {}
    },
  };

  // ---- Temas (só mudam círculos, texto e brilho; fundo continua escuro) ----
  const THEMES = [
    { id: "aurora", name: "Aurora",  accent: "#6fd6ff", accent2: "#b08bff", text: "#eaf2ff", muted: "#8ea0c9", glow1: "111,214,255", glow2: "176,139,255" },
    { id: "sunset", name: "Pôr do sol", accent: "#ffb37a", accent2: "#ff7eb0", text: "#ffeede", muted: "#c9a8a8", glow1: "255,179,122", glow2: "255,126,176" },
    { id: "mint",   name: "Menta",   accent: "#6affc8", accent2: "#58d7ff", text: "#e6fff7", muted: "#8ec9bf", glow1: "106,255,200", glow2: "88,215,255" },
    { id: "rose",   name: "Rosé",    accent: "#ff9ec4", accent2: "#c9a0ff", text: "#ffeaf4", muted: "#c5a0bf", glow1: "255,158,196", glow2: "201,160,255" },
    { id: "gold",   name: "Ouro",    accent: "#ffe08a", accent2: "#ffac5f", text: "#fff7e0", muted: "#c9bb8e", glow1: "255,224,138", glow2: "255,172,95" },
  ];

  function applyTheme(t) {
    const r = document.documentElement.style;
    r.setProperty("--accent", t.accent);
    r.setProperty("--accent-2", t.accent2);
    r.setProperty("--text", t.text);
    r.setProperty("--muted", t.muted);
    r.setProperty("--glow1", t.glow1);
    r.setProperty("--glow2", t.glow2);
  }

  function initThemes() {
    const wrap = document.getElementById("themes");
    let saved = store.get("breathe-theme", "aurora");
    if (!THEMES.some(t => t.id === saved)) saved = "aurora";

    THEMES.forEach(t => {
      const b = document.createElement("button");
      b.className = "swatch";
      b.type = "button";
      // setAttribute (e não b.role): o Safari mais antigo não reflete a
      // propriedade .role e ficaria sem semântica de radio
      b.setAttribute("role", "radio");
      b.title = t.name;
      b.setAttribute("aria-label", t.name);
      b.style.background = `linear-gradient(135deg, ${t.accent}, ${t.accent2})`;
      b.setAttribute("aria-checked", String(t.id === saved));
      b.addEventListener("click", () => {
        applyTheme(t);
        store.set("breathe-theme", t.id);
        wrap.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-checked", "false"));
        b.setAttribute("aria-checked", "true");
      });
      wrap.appendChild(b);
    });

    const t = THEMES.find(x => x.id === saved);
    if (t) applyTheme(t);
  }
  initThemes();

  const INHALE = 4, HOLD = 7, EXHALE = 8;

  const PHASES = [
    { name: "Inspire",  secs: INHALE, scale: 1.0,  hint: "Puxe o ar pelo nariz",       cls: "inhale" },
    { name: "Segure",   secs: HOLD,   scale: 1.0,  hint: "Prenda a respiração, com calma", cls: "hold"   },
    { name: "Expire",   secs: EXHALE, scale: 0.5,  hint: "Solte o ar pela boca, devagar", cls: "exhale" },
  ];

  const orb      = document.getElementById("orb");
  const phaseEl  = document.getElementById("phase");
  const countEl  = document.getElementById("count");
  const hintEl   = document.getElementById("hint");
  const cyclesEl = document.getElementById("cycles");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");
  const goalSel  = document.getElementById("goalSelect");
  const soundTgl = document.getElementById("soundToggle");
  const installBtn = document.getElementById("installBtn");
  const prog     = document.querySelector(".ring .prog");

  // ring circumference (r=48)
  const C = 2 * Math.PI * 48;
  prog.style.strokeDasharray = C;
  prog.style.strokeDashoffset = C;

  let state = "idle"; // idle | running | paused
  let phaseIdx = 0;
  let cycle = 0;
  let goal = 4;
  let phaseStart = 0;
  let pausedElapsed = 0;
  let lastTick = 0;
  let rafId = null;
  let audioCtx = null;
  let wakeLock = null;
  let pendingReload = false;

  function setGoal() {
    goal = parseInt(goalSel.value, 10) || 0;
    cyclesEl.innerHTML = goal === 0
      ? `Meta: <b>∞</b> &middot; relaxe o quanto quiser`
      : `Meta: <b>${goal}</b> ciclo${goal > 1 ? "s" : ""}`;
  }

  function showCycle() {
    cyclesEl.innerHTML = goal === 0
      ? `Ciclo <b>${cycle + 1}</b> &middot; relaxe`
      : `Ciclo <b>${cycle + 1}</b> de <b>${goal}</b>`;
  }

  // ---- soft tone cue on phase change ----
  function tone(freq, dur = 0.18) {
    if (!soundTgl.checked) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* ignore */ }
  }

  function vibrate(ms) {
    if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {}
  }

  // ---- mantém a tela acesa durante a sessão (quando o navegador suporta) ----
  async function keepAwake() {
    try {
      if (!("wakeLock" in navigator) || wakeLock) return;
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) { /* sem wake lock: segue normal */ }
  }

  function letSleep() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  // aplica o tamanho-alvo do orb com a duração desejada
  function animateOrb(p, dur) {
    orb.style.setProperty("--phase-dur", dur + "s");
    orb.style.setProperty("--scale", String(p.scale));
  }

  function enterPhase(idx) {
    phaseIdx = idx;
    const p = PHASES[idx];
    phaseStart = performance.now();

    phaseEl.textContent = p.name;
    hintEl.textContent = p.hint;

    animateOrb(p, p.secs);

    // cue
    const freqs = [440, 392, 294]; // inhale / hold / exhale
    tone(freqs[idx]);
    vibrate(idx === 0 ? 30 : 15);
  }

  function loop(now) {
    if (state !== "running") return;

    // O requestAnimationFrame congela quando a tela apaga ou o aparelho
    // dorme. Sem isso, ao voltar o app dispararia de uma vez todas as fases
    // "atrasadas". Buraco maior que meio segundo = pausa e espera o usuário.
    if (lastTick && now - lastTick > 1000) {
      pause(lastTick); // retoma de onde realmente parou, não do buraco
      return;
    }
    lastTick = now;

    const p = PHASES[phaseIdx];
    const elapsed = (now - phaseStart) / 1000;
    const remain = Math.max(0, p.secs - elapsed);

    countEl.textContent = Math.ceil(remain);

    // progress ring fills over the whole phase
    const frac = Math.min(1, elapsed / p.secs);
    prog.style.strokeDashoffset = C * (1 - frac);

    if (elapsed >= p.secs) {
      // advance
      let next = phaseIdx + 1;
      if (next >= PHASES.length) {
        next = 0;
        cycle++;
        if (goal !== 0 && cycle >= goal) {
          finish();
          return;
        }
        showCycle();
      }
      enterPhase(next);
    }
    rafId = requestAnimationFrame(loop);
  }

  function start() {
    if (state === "running") return;
    state = "running";
    lastTick = 0;
    cycle = 0;
    setGoal();
    orb.classList.remove("calm");
    startBtn.textContent = "Pausar";
    startBtn.classList.remove("primary");
    showCycle();
    keepAwake();
    enterPhase(0);
    rafId = requestAnimationFrame(loop);
  }

  function pause(atTime) {
    if (state !== "running") return;
    state = "paused";
    lastTick = 0;
    if (rafId) cancelAnimationFrame(rafId);
    // guarda quanto já correu da fase, pra retomar exatamente daqui
    const at = typeof atTime === "number" ? atTime : performance.now();
    pausedElapsed = Math.min(PHASES[phaseIdx].secs, Math.max(0, (at - phaseStart) / 1000));
    startBtn.textContent = "Continuar";
    startBtn.classList.add("primary");
    phaseEl.textContent = "Pausado";
    hintEl.textContent = "Toque em Continuar para seguir";
    letSleep();
    // freeze orb at current size
    const cs = getComputedStyle(orb).transform;
    orb.style.setProperty("--phase-dur", "0.3s");
    orb.style.transform = cs;
  }

  function resume() {
    if (state !== "paused") return;
    state = "running";
    lastTick = 0;
    startBtn.textContent = "Pausar";
    startBtn.classList.remove("primary");

    // retoma a fase de onde parou (não do começo)
    const p = PHASES[phaseIdx];
    const remain = Math.max(0.2, p.secs - pausedElapsed);
    phaseEl.textContent = p.name;
    hintEl.textContent = p.hint;
    orb.style.transform = "";
    animateOrb(p, remain);
    phaseStart = performance.now() - pausedElapsed * 1000;

    keepAwake();
    rafId = requestAnimationFrame(loop);
  }

  function finish() {
    state = "idle";
    lastTick = 0;
    if (rafId) cancelAnimationFrame(rafId);
    letSleep();
    orb.classList.add("calm");
    orb.style.transform = "";
    orb.style.setProperty("--scale", "0.55");
    phaseEl.textContent = "Concluído";
    countEl.textContent = "✓";
    hintEl.textContent = "Muito bem. Perceba como você se sente.";
    cyclesEl.innerHTML = `Você completou <b>${cycle}</b> ciclo${cycle > 1 ? "s" : ""}`;
    startBtn.textContent = "Iniciar";
    startBtn.classList.add("primary");
    prog.style.strokeDashoffset = 0;
    tone(523, 0.4);
    vibrate([40, 60, 40]);
  }

  function reset() {
    state = "idle";
    lastTick = 0;
    if (rafId) cancelAnimationFrame(rafId);
    letSleep();
    cycle = 0;
    phaseIdx = 0;
    pausedElapsed = 0;
    orb.classList.add("calm");
    orb.style.transform = "";
    orb.style.setProperty("--scale", "0.55");
    phaseEl.textContent = "Pronto";
    countEl.textContent = "4-7-8";
    hintEl.textContent = "Toque em Iniciar para começar";
    startBtn.textContent = "Iniciar";
    startBtn.classList.add("primary");
    prog.style.strokeDashoffset = C;
    setGoal();
    applyPendingReload();
  }

  function toggle() {
    if (state === "running") pause();
    else if (state === "paused") resume();
    else start();
  }

  startBtn.addEventListener("click", toggle);
  resetBtn.addEventListener("click", reset);
  goalSel.addEventListener("change", () => {
    store.set("breathe-goal", goalSel.value);
    if (state === "idle") setGoal();
  });
  soundTgl.addEventListener("change", () => store.set("breathe-sound", soundTgl.checked ? "1" : "0"));

  // atalhos de teclado (sem atrapalhar quem está usando os controles)
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t && (t.tagName === "BUTTON" || t.tagName === "SELECT" ||
              t.tagName === "INPUT" || t.isContentEditable)) return;
    if (e.code === "Space" || e.key === " ") { e.preventDefault(); toggle(); }
    else if (e.key && e.key.toLowerCase() === "r") { e.preventDefault(); reset(); }
  });

  // Sair da aba congela o requestAnimationFrame: sem isso, ao voltar o app
  // dispararia todas as fases atrasadas de uma vez. Pausa e espera o usuário.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (state === "running") pause();
    } else if (state === "idle") {
      applyPendingReload();
    }
  });

  // ---- estado inicial: preferências salvas + parâmetros do atalho ----
  const params = new URLSearchParams(location.search);
  const wantedGoal = params.get("ciclos") || store.get("breathe-goal", null);
  if (wantedGoal !== null &&
      Array.prototype.some.call(goalSel.options, (o) => o.value === wantedGoal)) {
    goalSel.value = wantedGoal;
  }
  soundTgl.checked = store.get("breathe-sound", "0") === "1";
  setGoal();
  if (params.get("auto") === "1") start();

  // ---- instalação (Android/Chrome oferece o prompt nativo) ----
  let installPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    installPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener("click", async () => {
    installBtn.hidden = true;
    if (!installPrompt) return;
    try {
      installPrompt.prompt();
      await installPrompt.userChoice;
    } catch (e) { /* ignore */ }
    installPrompt = null;
  });
  window.addEventListener("appinstalled", () => {
    installPrompt = null;
    installBtn.hidden = true;
  });

  function applyPendingReload() {
    if (pendingReload) {
      pendingReload = false;
      location.reload();
    }
  }

  // ---- service worker: funciona offline e se atualiza sozinho ----
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", async () => {
      try {
        const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });

        const promote = (worker) => {
          if (worker && worker.state === "installed" && navigator.serviceWorker.controller) {
            worker.postMessage("SKIP_WAITING");
          }
        };
        promote(reg.waiting);
        reg.addEventListener("updatefound", () => {
          const w = reg.installing;
          if (w) w.addEventListener("statechange", () => promote(w));
        });

        let swapped = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (swapped) return;
          swapped = true;
          // nunca recarregar no meio de uma sessão de respiração
          if (state === "idle") location.reload();
          else pendingReload = true;
        });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      } catch (e) { /* sem service worker: o app funciona igual, só sem offline */ }
    });
  }
})();
</script>
</body>
</html>
